name: Build NOCTURNE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Download Spotify App Remote SDK
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 "https://github.com/spotify/android-sdk/releases/download/v0.8.0-appremote_v2.1.0-auth/spotify-app-remote-release-0.8.0.aar" -o app/libs/spotify-app-remote-release-0.8.0.aar
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Print APK signing fingerprint
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
